server.port=8080
spring.application.name=job-portal

# ---- Database (default local H2; override with DB_URL for MySQL) ----
spring.datasource.url=${DB_URL:jdbc:h2:mem:jobportal;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# ---- JWT (secret must be >= 32 chars) ----
app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-string-123456}
app.jwt.expiration-minutes=120

# ---- AES-256 key: Base64 of 32 bytes. Generate: openssl rand -base64 32 ----
app.aes.key=${APP_AES_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

# ---- Default admin (created on first start) ----
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
