server.port=8080
spring.application.name=job-portal

# ---- Database (default local MySQL via WAMP; override with DB_URL for another DB) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jobportal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}

# ---- JWT (secret must be >= 32 chars) ----
app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-string-123456}
app.jwt.expiration-minutes=120

# ---- AES-256 key: Base64 of 32 bytes. Generate: openssl rand -base64 32 ----
app.aes.key=${APP_AES_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

# ---- Default admin (created on first start) ----
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
