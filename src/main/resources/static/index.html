<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobPortal - Find your next job</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="/">JobPortal</a>
    <a class="btn btn-outline-secondary btn-sm" href="admin.html">Admin Panel</a>
  </div>
</nav>

<section class="hero">
  <div class="container text-center">
    <h1 class="fw-bold">Find your next opportunity</h1>
    <p class="lead mb-4">Browse open positions and apply in a minute.</p>
    <form id="searchForm" class="row g-2 justify-content-center">
      <div class="col-md-6"><input id="q" class="form-control form-control-lg" placeholder="Search by job title..."></div>
      <div class="col-auto"><button class="btn btn-dark btn-lg">Search</button></div>
    </form>
  </div>
</section>

<main class="container my-4">
  <div id="jobs" class="row g-3"></div>
  <p id="empty" class="text-center text-muted d-none my-5">No jobs found.</p>
  <nav class="mt-4"><ul id="pager" class="pagination justify-content-center"></ul></nav>
</main>

<!-- Apply modal -->
<div class="modal fade" id="applyModal" tabindex="-1">
  <div class="modal-dialog">
    <form id="applyForm" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Apply: <span id="applyTitle"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="applyAlert" class="alert d-none"></div>
        <input type="hidden" id="applyJobId">
        <div class="mb-3"><label class="form-label">Full name</label><input id="candidateName" class="form-control" required maxlength="120"></div>
        <div class="mb-3"><label class="form-label">Email</label><input id="email" type="email" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Phone</label><input id="phone" class="form-control" required placeholder="+91 9876543210"></div>
        <div class="mb-3"><label class="form-label">Cover letter (optional)</label><textarea id="coverLetter" class="form-control" rows="4" maxlength="2000"></textarea></div>
      </div>
      <div class="modal-footer"><button class="btn btn-brand">Submit application</button></div>
    </form>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/public.js"></script>
</body>
</html>
