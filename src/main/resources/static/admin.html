<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobPortal - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="container d-none">
  <form id="loginForm" class="card login-box shadow-sm">
    <div class="card-body p-4">
      <h4 class="text-brand mb-3">Admin Login</h4>
      <div id="loginError" class="alert alert-danger d-none"></div>
      <div class="mb-3"><label class="form-label">Username</label><input id="username" class="form-control" required autofocus></div>
      <div class="mb-3"><label class="form-label">Password</label><input id="password" type="password" class="form-control" required></div>
      <button class="btn btn-brand w-100">Login</button>
      <a href="/" class="d-block text-center mt-3 small">&larr; Back to site</a>
    </div>
  </form>
</div>

<!-- APP -->
<div id="appView" class="d-none">
  <nav class="navbar bg-white shadow-sm">
    <div class="container-fluid">
      <span class="navbar-brand">JobPortal Admin</span>
      <div><span id="whoami" class="me-3 text-muted"></span><button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button></div>
    </div>
  </nav>

  <div class="container-fluid my-3">
    <div class="row">
      <div class="col-md-2 mb-3">
        <div class="nav flex-column admin-nav">
          <a class="nav-link active" data-tab="dashboard" href="#">Dashboard</a>
          <a class="nav-link" data-tab="jobs" href="#">Jobs</a>
          <a class="nav-link" data-tab="applications" href="#">Applications</a>
        </div>
      </div>

      <div class="col-md-10">
        <!-- Dashboard -->
        <section id="tab-dashboard">
          <div class="row g-3 mb-4" id="stats"></div>
          <div class="card stat-card"><div class="card-body">
            <h6>Top jobs by applications</h6>
            <ul id="topJobs" class="list-group list-group-flush"></ul>
          </div></div>
        </section>

        <!-- Jobs -->
        <section id="tab-jobs" class="d-none">
          <div class="d-flex justify-content-between mb-3">
            <form id="jobSearch" class="d-flex gap-2"><input id="jobQ" class="form-control" placeholder="Search title / company"><button class="btn btn-outline-secondary">Search</button></form>
            <button id="addJobBtn" class="btn btn-brand">+ Add Job</button>
          </div>
          <div class="table-responsive card stat-card"><table class="table table-hover mb-0">
            <thead><tr><th>#</th><th>Title</th><th>Company</th><th>Location</th><th>Type</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="jobsBody"></tbody>
          </table></div>
          <ul id="jobsPager" class="pagination mt-3"></ul>
        </section>

        <!-- Applications -->
        <section id="tab-applications" class="d-none">
          <div class="table-responsive card stat-card"><table class="table table-hover mb-0">
            <thead><tr><th>#</th><th>Job</th><th>Candidate</th><th>Email</th><th>Phone</th><th>Cover letter</th><th>Status</th><th>Applied</th><th></th></tr></thead>
            <tbody id="appsBody"></tbody>
          </table></div>
          <ul id="appsPager" class="pagination mt-3"></ul>
        </section>
      </div>
    </div>
  </div>
</div>

<!-- Job modal -->
<div class="modal fade" id="jobModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <form id="jobForm" class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="jobModalTitle">Add Job</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div id="jobError" class="alert alert-danger d-none"></div>
        <input type="hidden" id="jobId">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Title *</label><input id="jTitle" class="form-control" required maxlength="150"></div>
          <div class="col-md-6"><label class="form-label">Company *</label><input id="jCompany" class="form-control" required maxlength="150"></div>
          <div class="col-md-4"><label class="form-label">Location</label><input id="jLocation" class="form-control"></div>
          <div class="col-md-4"><label class="form-label">Job type</label>
            <select id="jType" class="form-select"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Hybrid</option><option>Remote</option></select></div>
          <div class="col-md-4"><label class="form-label">Salary</label><input id="jSalary" class="form-control"></div>
          <div class="col-md-12"><label class="form-label">Status</label>
            <select id="jStatus" class="form-select"><option value="OPEN">OPEN</option><option value="CLOSED">CLOSED</option></select></div>
          <div class="col-12"><label class="form-label">Description</label><textarea id="jDesc" class="form-control" rows="5" maxlength="4000"></textarea></div>
        </div>
      </div>
      <div class="modal-footer"><button class="btn btn-brand">Save</button></div>
    </form>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
